# Quick test config for aloha_sim_transfer_cube_human
# RTX 5070 Ti 16GB — LoRA + QLoRA (4bit)

# Model
model_name: "google/gemma-4-E2B-it"
num_action_tokens: 1
visual_token_budget: 140  # Low budget for speed

# Action space (ALOHA dual-arm: 14 DOF)
action_dim: 14
chunk_size: 1

# Cameras
cameras:
  - "observation.images.top"

# Proprioception
proprio_dim: 14
proprio_key: "observation.state"

# Action head
action_head:
  type: "mlp"
  hidden_dims: [512, 256]

# Training
training:
  strategy: "lora"
  lora:
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
  batch_size: 2
  lr: 1.0e-4
  weight_decay: 0.01
  num_epochs: 1
  warmup_steps: 10
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  save_every_n_steps: 50
  eval_every_n_steps: 25

# Data
data:
  dataset_name: "lerobot/aloha_sim_transfer_cube_human"
  language_instruction_key: "language_instruction"
  default_instruction: "transfer the cube from one arm to the other"
  normalizer_path: null

# Inference
inference:
  quantization: "4bit"
