# LIBERO libero_spatial benchmark config with ACTHead
# 7DOF EEF delta actions, 9D proprio, 2 cameras

model_name: "google/gemma-4-E2B-it"
num_action_tokens: 1
visual_token_budget: 140

action_dim: 7
chunk_size: 20
proprio_dim: 8
proprio_key: "observation.state"

# Evaluation: LIBERO sim observation key names
cameras:
  - "agentview_image"
  - "robot0_eye_in_hand_image"

# Training: LeRobot dataset camera key names (used by VLADataset)
lerobot_cameras:
  - "observation.images.image"
  - "observation.images.wrist_image"

action_head:
  type: "act"
  d_model: 256
  nhead: 8
  num_layers: 6
  dim_feedforward: 2048
  dropout: 0.1
  temporal_ensemble_m: 0.01

training:
  strategy: "lora"
  lora:
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
  batch_size: 16
  lr: 5.0e-5
  weight_decay: 0.01
  num_epochs: 1
  warmup_steps: 100
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  save_every_n_steps: 500
  eval_every_n_steps: 250

data:
  dataset_name: "lerobot/libero_spatial_image"
  language_instruction_key: "task"
  default_instruction: "manipulation task"
  normalizer_path: "outputs/libero/action_stats.json"

inference:
  quantization: "4bit"
